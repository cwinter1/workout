function sectionHeader(text) {

function getExInfo(name) {
  return EX_INFO[name] || {
    desc: 'Follow the movement shown. Focus on control and breathing throughout.',
    gif: `${name.toLowerCase().replace(/[^a-z0-9 ]/g,' ')} exercise`,
  };
}

// GIF cache
const gifCache = {};
async function fetchGif(query) {
  if (gifCache[query]) return gifCache[query];
  try {
    const res = await fetch(`https://api.giphy.com/v1/gifs/search?api_key=dc6zaTOxFJmzC&q=${encodeURIComponent(query)}&limit=5&rating=g`);
    const data = await res.json();
    if (data.data?.length) {
      const url = data.data[0].images.fixed_height.url;
      gifCache[query] = url;
      return url;
    }
  } catch {}
  return null;
}

function phaseSeconds(totalMin) {
  const s = PROGRAM.phaseShare, total = totalMin * 60;
  return {
    stretch: Math.round(total * s.stretch),
    warmup:  Math.round(total * s.warmup),
    main:    Math.round(total * s.main),
    yoga:    Math.round(total * s.yoga),
    meditation: 180,
  };
}

function buildTimeline(dayIdx, week, totalMin) {
  const day = PROGRAM.days[dayIdx];
  const totals = phaseSeconds(totalMin);
  const out = [];
  day.phases.forEach((ph, pi) => {
    if (ph.id === 'meditation') {
      out.push({ phaseIdx:pi, phaseId:ph.id, phaseName:ph.name, intent:ph.intent,
        exIdx:0, exName:ph.exercises[0].name, variant:ph.exercises[0].variants[week-1],
        seconds:totals.meditation, kind:'meditation' });
      return;
    }
    const each = Math.max(20, Math.round(totals[ph.id] / ph.exercises.length));
    ph.exercises.forEach((ex, ei) => {
      out.push({ phaseIdx:pi, phaseId:ph.id, phaseName:ph.name, intent:ph.intent,
        exIdx:ei, exName:ex.name, variant:ex.variants[week-1], seconds:each, kind:'exercise' });
    });
  });
  return out;
}

function fmt(s) {
  if (s < 0) s = 0;
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}

function nextSession() {
  for (let w = 1; w <= 4; w++)
    for (let d = 0; d < 3; d++)
      if (!state.progress[`w${w}d${d}`]) return { week: w, day: d };
  return { week: 4, day: 2 };
}

state.week = ns.week; state.day = ns.day;

  if (state.view === 'home')      renderHome(root);
  else if (state.view === 'preview')  renderPreview(root);
  else if (state.view === 'session')  renderSession(root);
  else if (state.view === 'done')     renderDone(root);
  else if (state.view === 'program')  renderProgram(root);
}

// ═══════════════════════════════════════════════════════
// SESSION START
// ═══════════════════════════════════════════════════════
function startSession() {
  clearInterval(timerInterval);
  state.timeline = buildTimeline(state.day, state.week, SESSION_MIN);
  state.idx = 0;
  state.left = state.timeline[0].seconds;
  state.paused = false;
  state.view = 'preview';
  render();
}

function pickDay(w, d) {
  state.week = w; state.day = d;
  startSession();
}

function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (state.paused) return;
    state.left--;
    if (state.left <= 0) {
      clearInterval(timerInterval);
      beep();
      if (state.idx + 1 < state.timeline.length) {
        state.idx++;
        state.left = state.timeline[state.idx].seconds;
        state.view = 'preview';
        render();
      } else {
        finishSession();
      }
    } else {
      updateTimerDisplay();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const cur = state.timeline[state.idx];

  const numEl = document.getElementById('timer-num');
  if (numEl) numEl.textContent = fmt(state.left);

  const medCountdown = document.getElementById('med-countdown');
  if (medCountdown) {
    medCountdown.textContent = fmt(state.left);
    const { label, scale, phaseDur, withinPhase } = getMedState();
    const boxEl = document.getElementById('med-box');
    const labelEl = document.getElementById('med-label');
    const countEl = document.getElementById('med-count');
    if (boxEl) boxEl.style.transform = `scale(${scale})`;
    if (labelEl) labelEl.textContent = label;
    if (countEl) countEl.textContent = Math.max(0, phaseDur - withinPhase);
  }

  const progEl = document.getElementById('session-prog');
  if (progEl) {
    const totalSec = state.timeline.reduce((a, t) => a + t.seconds, 0);
    const doneSec = state.timeline.slice(0, state.idx).reduce((a, t) => a + t.seconds, 0) + (cur.seconds - state.left);
    progEl.style.width = `${(doneSec / totalSec) * 100}%`;
  }
}

function getMedState() {
  const cur = state.timeline[state.idx];
  const m = cur.variant.match(/(\d+)/g);
  const phases = m ? m.slice(0, 4).map(Number) : [4, 4, 4, 4];
  const cycleSec = phases.reduce((a, b) => a + b, 0);
  const elapsed = cur.seconds - state.left;
  const inCycle = elapsed % cycleSec;
  const phaseLabels = ['Inhale', 'Hold', 'Exhale', 'Hold'];
  let phaseIdx = 0, accum = 0, withinPhase = 0;
  for (let i = 0; i < 4; i++) {
    if (inCycle < accum + phases[i]) { phaseIdx = i; withinPhase = inCycle - accum; break; }
    accum += phases[i];
  }
  const phaseDur = phases[phaseIdx];
  let scale = 0.55;
  if (phaseIdx === 0) scale = 0.55 + 0.45 * (withinPhase / phaseDur);
  else if (phaseIdx === 1) scale = 1;
  else if (phaseIdx === 2) scale = 1 - 0.45 * (withinPhase / phaseDur);
  return { phases, phaseIdx, withinPhase, phaseDur, label: phaseLabels[phaseIdx], scale };
}

  const breathBox = el('div', `width:220px;height:220px;border-radius:8px;background:${T.accent}22;border:1.5px solid ${T.accent};transform:scale(${scale});transition:transform 1s linear;display:flex;align-items:center;justify-content:center;flex-direction:column;`);
  breathBox.id = 'med-box';
  const breathLabel = el('div', `font-family:${T.display};font-size:28px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:${T.fg};`);
  breathLabel.id = 'med-label';
  breathLabel.textContent = label;
  const breathCount = el('div', `font-family:${T.mono_ff};font-size:36px;font-weight:500;color:${T.accent};margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-1px;`);
  breathCount.id = 'med-count';
  breathCount.textContent = Math.max(0, phaseDur - withinPhase);
  breathBox.append(breathLabel, breathCount);
  boxWrap.append(outerRing, breathBox);

  const timeRemain = el('div', `text-align:center;`);
  const timeLbl = el('div', `font-family:${T.mono_ff};font-size:11px;color:${T.mono};letter-spacing:2px;text-transform:uppercase;`);
  timeLbl.textContent = 'Time remaining';
  const timeNum = el('div', `font-family:${T.mono_ff};font-size:32px;font-weight:500;color:${T.fg};margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-1px;`);
  timeNum.id = 'med-countdown';
  timeNum.textContent = fmt(state.left);
  timeRemain.append(timeLbl, timeNum);

  body.append(boxWrap, timeRemain);
  root.append(hdr, body, renderControls());
}

function renderControls() {
  const ctrls = el('div', `padding:14px 22px;display:flex;gap:10px;flex-shrink:0;padding-bottom:calc(env(safe-area-inset-bottom,14px)+14px);`);
  const pauseBtn = el('button', `flex:2;appearance:none;border:none;background:${T.fg};color:${T.bg};border-radius:6px;padding:18px;font-family:${T.display};font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:0.5px;display:flex;align-items:center;justify-content:center;gap:10px;`);
  pauseBtn.id = 'pause-btn';
  pauseBtn.innerHTML = `${state.paused ? iconPlay(T.bg) : iconPause(T.bg)} ${state.paused ? 'Resume' : 'Pause'}`;
  pauseBtn.onclick = togglePause;
  const skipBtn = el('button', `flex:1;appearance:none;background:transparent;border:1px solid ${T.hairline};color:${T.fg};border-radius:6px;padding:18px;font-family:${T.display};font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:0.5px;display:flex;align-items:center;justify-content:center;gap:8px;`);
  skipBtn.innerHTML = `${iconNext(T.fg)} Skip`;
  skipBtn.onclick = skipExercise;
  ctrls.append(pauseBtn, skipBtn);
  return ctrls;
}

function togglePause() {
  state.paused = !state.paused;
  const btn = document.getElementById('pause-btn');
  if (btn) btn.innerHTML = `${state.paused ? iconPlay(T.bg) : iconPause(T.bg)} ${state.paused ? 'Resume' : 'Pause'}`;
}

function skipExercise() {
  clearInterval(timerInterval);
  if (state.idx + 1 < state.timeline.length) {
    state.idx++;
    state.left = state.timeline[state.idx].seconds;
    state.view = 'preview';
    render();
  } else {
    finishSession();
  }
}

function abortSession() {
  clearInterval(timerInterval);
  const ns2 = nextSession();
  state.week = ns2.week; state.day = ns2.day;
  state.view = 'home';
  render();
}

function finishSession() {
  clearInterval(timerInterval);
  const key = `w${state.week}d${state.day}`;
  state.progress[key] = { done: true, at: Date.now() };
  saveProgress();
  state.view = 'done';
  render();
}

// ═══════════════════════════════════════════════════════
// DONE
// ═══════════════════════════════════════════════════════
function renderDone(root) {
  const total = Object.keys(state.progress).length;
  const wrap = el('div', `flex:1;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,12px)+40px) 22px calc(env(safe-area-inset-bottom,14px)+24px);justify-content:space-between;`);

  const top = el('div', ``);
  const tag = el('div', `font-family:${T.mono_ff};font-size:11px;color:${T.accent};letter-spacing:2px;text-transform:uppercase;`);
  tag.textContent = 'Session complete';
  const title = el('div', `font-family:${T.display};font-size:52px;line-height:0.95;margin-top:12px;font-weight:700;text-transform:uppercase;letter-spacing:-1px;`);
  title.innerHTML = `Done.<br><span style="color:${T.accent}">Banked.</span>`;
  top.append(tag, title);

  const stats = el('div', `display:flex;flex-direction:column;gap:12px;`);
  [
    ['Duration', `${SESSION_MIN} min`],
    ['Phases', '5 · Bend → Meditation'],
    ['Week', `${state.week} of 4 · day ${state.day + 1}`],
    ['Program', `${total} of 12 sessions banked`],
  ].forEach(([k, v]) => stats.appendChild(renderStat(k, v)));

  const bankBtn = el('button', `appearance:none;border:none;background:${T.accent};color:${T.accentT};border-radius:6px;padding:18px 22px;font-family:${T.display};font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:0.5px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;`);
  bankBtn.innerHTML = `${iconCheck(T.accentT)} Bank it`;
  bankBtn.onclick = () => {
    const ns2 = nextSession();
    state.week = ns2.week; state.day = ns2.day;
    state.view = 'home';
    render();
  };

  wrap.append(top, stats, bankBtn);
  root.appendChild(wrap);
}

// ═══════════════════════════════════════════════════════
// PROGRAM
// ═══════════════════════════════════════════════════════
function renderProgram(root) {
  const hdr = el('div', `padding:calc(env(safe-area-inset-top,12px)+12px) 22px 12px;display:flex;align-items:center;gap:14px;flex-shrink:0;`);
  const backBtn = el('button', `appearance:none;border:1px solid ${T.hairline};background:transparent;color:${T.fg};width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;`);
  backBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 14 14" stroke="${T.fg}" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="10,2 4,7 10,12"/></svg>`;
  backBtn.onclick = () => { state.view = 'home'; render(); };
  const title = el('div', `font-family:${T.display};font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:0.5px;`);
  title.textContent = '4-Week Program';
  hdr.append(backBtn, title);

  const scroll = el('div', `flex:1;overflow-y:auto;padding:0 22px;`);
  const body = el('div', `display:flex;flex-direction:column;gap:28px;padding-bottom:40px;margin-top:8px;`);

  PROGRAM.days.forEach((day, di) => {
    const daySection = el('div', ``);
    const dayHdr = el('div', `margin-bottom:14px;`);
    const dayTag = el('div', `font-family:${T.mono_ff};font-size:10px;color:${T.accent};letter-spacing:2px;text-transform:uppercase;`);
    dayTag.textContent = `Day ${di + 1} · ${day.tag}`;
    const dayTitle = el('div', `font-family:${T.display};font-weight:700;font-size:28px;text-transform:uppercase;letter-spacing:-0.5px;line-height:1;margin-top:4px;`);
    dayTitle.textContent = day.title;
    const daySub = el('div', `font-family:${T.mono_ff};font-size:11px;color:${T.mono};margin-top:4px;letter-spacing:1px;`);
    daySub.textContent = day.kicker;
    dayHdr.append(dayTag, dayTitle, daySub);

    const phaseList = el('div', `display:flex;flex-direction:column;gap:6px;`);
    day.phases.forEach(ph => {
      const phCard = el('div', `background:${T.card};border:1px solid ${T.hairline};border-radius:6px;padding:14px;`);
      const phHdr = el('div', `display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;`);
      const phName = el('div', `font-family:${T.display};font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:0.5px;`);
      phName.textContent = ph.name;
      const phIntent = el('div', `font-family:${T.mono_ff};font-size:10px;color:${T.mono};letter-spacing:0.5px;max-width:200px;text-align:right;`);
      phIntent.textContent = ph.intent;
      phHdr.append(phName, phIntent);

      const exList = el('div', `display:flex;flex-direction:column;gap:4px;`);
      ph.exercises.forEach((ex, ei) => {
        const row = el('div', `display:flex;align-items:baseline;gap:8px;`);
        const num = el('span', `font-family:${T.mono_ff};font-size:10px;color:${T.mono};letter-spacing:1px;flex-shrink:0;`);
        num.textContent = `${ei+1}.`;
        const name = el('span', `font-size:13px;color:${T.fg};`);
        name.textContent = ex.name;
        const week1 = el('span', `font-family:${T.mono_ff};font-size:11px;color:${T.mono};margin-left:auto;flex-shrink:0;`);
        week1.textContent = `W1: ${ex.variants[0]}`;
        row.append(num, name, week1);
        exList.appendChild(row);
      });
      phCard.append(phHdr, exList);
      phaseList.appendChild(phCard);
    });

    // week progression for this day
    const weekProg = el('div', `margin-top:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;`);
    [1,2,3,4].forEach(w => {
      const done = !!state.progress[`w${w}d${di}`];
      const btn = el('button', `border:none;background:${done ? T.accent : T.pill};color:${done ? T.accentT : T.mono};border-radius:4px;padding:10px 6px;font-family:${T.mono_ff};font-size:10px;letter-spacing:1px;text-transform:uppercase;`);
      btn.textContent = done ? `W${w} ✓` : `W${w}`;
      btn.onclick = () => pickDay(w, di);
      weekProg.appendChild(btn);
    });

    daySection.append(dayHdr, phaseList, weekProg);
    body.appendChild(daySection);
  });

  scroll.appendChild(body);
  root.append(hdr, scroll);
}

// ═══════════════════════════════════════════════════════
// SOUND
// ═══════════════════════════════════════════════════════
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine'; o.frequency.setValueAtTime(660, ctx.currentTime);
    g.gain.setValueAtTime(0.3, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    o.start(); o.stop(ctx.currentTime + 0.4);
    if (navigator.vibrate) navigator.vibrate([60, 30, 60]);
  } catch {}
}

// ═══════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════
render();
</script>
</body>
