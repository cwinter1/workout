<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0e1116">
<title>Daily Routine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: #0e1116; font-family: 'Manrope', system-ui, sans-serif; overscroll-behavior: none; }
button { font-family: inherit; cursor: pointer; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body>
<div id="root" style="height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;"></div>

<!--
  See squat-coach.html for why the legacy MediaPipe Pose "Solutions" API (classic globals) is
  used here instead of the newer ES-module-only Tasks Vision API, and why camera capture is
  driven directly via getUserMedia (form-coach-engine.js) instead of @mediapipe/camera_utils'
  Camera helper. This page reuses ONE Pose instance across all 9 routine steps (see
  form-coach-engine.js's ensurePose) rather than re-initializing per exercise.
-->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
<script src="shared.js"></script>
<script src="form-coach-engine.js"></script>
<script src="exercise-squat.js"></script>
<script src="exercise-pushup.js"></script>
<script src="exercise-lunge.js"></script>
<script src="exercise-plank.js"></script>
<script src="daily-routine.js"></script>
</body>
</html>
